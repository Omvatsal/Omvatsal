<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="18" y="18" width="864" height="614" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="18" y="18" width="864" height="52" rx="14" fill="#161b22"/>
  <rect x="18" y="55" width="864" height="15" fill="#161b22"/>

  <!-- Window controls -->
  <circle cx="45" cy="44" r="7" fill="#ff5f57"/>
  <circle cx="68" cy="44" r="7" fill="#febc2e"/>
  <circle cx="91" cy="44" r="7" fill="#28c840"/>

  <!-- Title -->
  <text x="450" y="49" text-anchor="middle"
        fill="#8b949e" font-family="monospace" font-size="15">
    om@iiitnagpur: ~/tech
  </text>

  <!-- Terminal content -->
  <g font-family="monospace" font-size="17">
    <!-- Prompt 1 -->
    <text x="42" y="105" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="105" fill="#8b949e">:</text>
    <text x="202" y="105" fill="#79c0ff">~/tech</text>
    <text x="270" y="105" fill="#f0f6fc">$</text>
    <text x="288" y="105" fill="#f0f6fc">ls</text>

    <!-- ls output -->
    <text x="42" y="139" fill="#7ee787">code/</text>
    <text x="145" y="139" fill="#7ee787">web/</text>
    <text x="245" y="139" fill="#7ee787">ai/</text>
    <text x="325" y="139" fill="#7ee787">data/</text>
    <text x="435" y="139" fill="#7ee787">systems/</text>

    <!-- code -->
    <text x="42" y="188" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="188" fill="#8b949e">:</text>
    <text x="202" y="188" fill="#79c0ff">~/tech</text>
    <text x="270" y="188" fill="#f0f6fc">$</text>
    <text x="288" y="188" fill="#f0f6fc">cat code/*</text>

    <text x="42" y="222" fill="#c9d1d9">C++  ·  Python  ·  JavaScript  ·  TypeScript</text>

    <!-- web -->
    <text x="42" y="271" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="271" fill="#8b949e">:</text>
    <text x="202" y="271" fill="#79c0ff">~/tech</text>
    <text x="270" y="271" fill="#f0f6fc">$</text>
    <text x="288" y="271" fill="#f0f6fc">cat web/*</text>

    <text x="42" y="305" fill="#c9d1d9">React  ·  Next.js  ·  Node.js  ·  Express  ·  Tailwind CSS</text>

    <!-- ai -->
    <text x="42" y="354" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="354" fill="#8b949e">:</text>
    <text x="202" y="354" fill="#79c0ff">~/tech</text>
    <text x="270" y="354" fill="#f0f6fc">$</text>
    <text x="288" y="354" fill="#f0f6fc">cat ai/*</text>

    <text x="42" y="388" fill="#c9d1d9">PyTorch  ·  Transformers  ·  scikit-learn  ·  NLP  ·  Computer Vision</text>

    <!-- data -->
    <text x="42" y="437" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="437" fill="#8b949e">:</text>
    <text x="202" y="437" fill="#79c0ff">~/tech</text>
    <text x="270" y="437" fill="#f0f6fc">$</text>
    <text x="288" y="437" fill="#f0f6fc">cat data/*</text>

    <text x="42" y="471" fill="#c9d1d9">PostgreSQL  ·  MongoDB  ·  Supabase</text>

    <!-- systems -->
    <text x="42" y="520" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="520" fill="#8b949e">:</text>
    <text x="202" y="520" fill="#79c0ff">~/tech</text>
    <text x="270" y="520" fill="#f0f6fc">$</text>
    <text x="288" y="520" fill="#f0f6fc">cat systems/*</text>

    <text x="42" y="554" fill="#c9d1d9">Docker  ·  Linux  ·  Git</text>

    <!-- Final prompt -->
    <text x="42" y="603" fill="#58a6ff">om@iiitnagpur</text>
    <text x="190" y="603" fill="#8b949e">:</text>
    <text x="202" y="603" fill="#79c0ff">~/tech</text>
    <text x="270" y="603" fill="#f0f6fc">$</text>
    <rect x="288" y="588" width="10" height="18" fill="#58a6ff" opacity="0.9"/>
  </g>
</svg>
